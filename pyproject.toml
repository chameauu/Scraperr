[project]
name = "scraper"
version = "0.1.0"
description = "Lightweight web-scraping agent core (LangGraph + Lightpanda)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "httpx",
  "pydantic",
  "playwright",
  "beautifulsoup4",
  "python-dotenv",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "pre-commit",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
