services:
  searxng:
    image: searxng/searxng:2026.9.23-3cd69d30e
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_INSTANCE_NAME=Local SearXNG
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  lightpanda:
    image: lightpanda/browser:0.4.1
    container_name: lightpanda-test
    ports:
      - "127.0.0.1:9222:9222"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command:
      - /bin/lightpanda
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "9222"
      - --http-timeout
      - "60000"
      - --http-connect-timeout
      - "30000"
      - --watchdog-ms
      - "120000"
      - --load-resources
      - "stylesheet"
      - --http-session-timeout
      - "0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
